<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Ko</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --ink: #1b2430; --muted: #5d6b7c;
    --line: #d9dfe7; --in: #1f7a5c; --out: #b4532a; --focus: #2b5fd9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131a22; --panel: #1b242f; --ink: #e8edf3; --muted: #9aa8b8; --line: #2c3947; --in: #3fb98f; --out: #e08a5c; --focus: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; margin-bottom: 16px; }
  .hero { text-align: center; }
  #clock { font-size: clamp(3rem, 14vw, 5.5rem); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.05; }
  #date { color: var(--muted); margin-top: 4px; }
  #status { margin: 16px 0; font-weight: 600; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button, input { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .big { min-width: 150px; padding: 14px 28px; border: 0; border-radius: 8px; font-weight: 700; color: #fff; cursor: pointer; }
  #btnIn { background: var(--in); } #btnOut { background: var(--out); }
  .big:disabled { opacity: .35; cursor: not-allowed; }
  #note { display: block; width: min(100%, 360px); margin: 16px auto 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h2 { margin: 0; font-size: 1.1rem; }
  .tools { display: flex; gap: 8px; }
  .tools input, .tools button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; }
  .tools .danger { color: var(--out); border-color: var(--out); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .stats div { border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  .stats b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); font-size: .875rem; }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 780px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: .875rem; }
  td { font-variant-numeric: tabular-nums; }
  .inline { width: 100%; min-width: 150px; border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 6px; }
  .inline:hover, .inline:focus { border-color: var(--line); background: var(--bg); }
  .loc { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
  .loc div { overflow: hidden; text-overflow: ellipsis; }
  .loc small { color: var(--muted); }
  .loc a { color: var(--focus); }
  .del { border: 0; background: none; color: var(--out); cursor: pointer; padding: 4px 8px; }
  .del:hover { text-decoration: underline; }
  .empty { text-align: center; color: var(--muted); padding: 32px 8px; white-space: normal; }
  .foot { text-align: center; color: var(--muted); font-size: .875rem; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); padding: 10px 18px; border-radius: 8px; color: #fff; opacity: 0; pointer-events: none; transition: .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.ok { background: var(--in); } #toast.err { background: var(--out); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div id="clock">--:--:--</div>
    <div id="date"></div>
    <div id="status" aria-live="polite">Naglo-load…</div>
    <div class="actions">
      <button id="btnIn" class="big">Time In</button>
      <button id="btnOut" class="big">Time Out</button>
    </div>
    <input id="note" placeholder="Note para ngayong araw (opsyonal)" aria-label="Note">
  </section>

  <section>
    <div class="head">
      <h2>Mga record</h2>
      <div class="tools">
        <input type="month" id="month" aria-label="Buwan">
        <button id="export">I-export (CSV)</button>
        <button id="restart" class="danger">I-restart</button>
      </div>
    </div>
    <div class="stats">
      <div><b id="days">0</b><span>Araw na pumasok</span></div>
      <div><b id="hours">—</b><span>Kabuuang oras</span></div>
      <div><b id="avg">—</b><span>Karaniwang oras bawat araw</span></div>
    </div>
    <div class="wrap">
      <table>
        <thead><tr><th>Petsa</th><th>Time in</th><th>Time out</th><th>Oras</th><th>Lokasyon</th><th>Note</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
  <p id="storage" class="foot"></p>
</main>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
